<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>LetsDoTogether — Discover Activities. Meet People. Build Connections.</title>
    <meta name="description" content="LetsDoTogether is a social platform to discover activities, meet people, and build real connections in your city. Join events, learn skills, and find your people." />
    <meta name="keywords" content="activities, events, social, meetup, connect, people, hobbies, skills, community, India" />
    <meta name="author" content="LetsDoTogether" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LetsDoTogether" />
    <meta property="og:url" content="https://letsdotogether.app/" />
    <meta property="og:title" content="LetsDoTogether — Find Your Tribe" />
    <meta property="og:description" content="Discover activities, meet like-minded people, and build real friendships in your city. Not a social feed — a real community." />
    <meta property="og:image" content="https://letsdotogether.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LetsDoTogether — Discover Activities, Meet People" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@letsdotogether" />
    <meta name="twitter:title" content="LetsDoTogether — Find Your Tribe" />
    <meta name="twitter:description" content="Discover activities, meet like-minded people, and build real friendships in your city." />
    <meta name="twitter:image" content="https://letsdotogether.app/og-image.png" />

    <!-- Theme & PWA basics -->
    <meta name="theme-color" content="#6f9a35" />
    <meta name="application-name" content="LetsDoTogether" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
